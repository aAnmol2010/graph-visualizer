name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (prod + dev)
        run: pip install -r requirements.txt pytest pytest-cov mypy ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy . --ignore-missing-imports --disallow-untyped-defs
        continue-on-error: true   # advisory in CI for now; make strict later

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-omit="tests/*,*/__pycache__/*" \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true   # don't fail if token not configured
