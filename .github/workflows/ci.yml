name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (prod + dev)
        run: pip install -r requirements.txt "pytest>=8.0" "pytest-cov>=5.0" "mypy>=1.9" "ruff>=0.4"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy . --ignore-missing-imports --disallow-untyped-defs
        continue-on-error: true   # advisory in CI for now; make strict later

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --cov=. --cov-report=term-missing
